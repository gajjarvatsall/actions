name: CI/CD Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build user-service
              run: |
                  docker build -t user-service:latest ./user-service

            - name: Build post-service
              run: |
                  docker build -t post-service:latest ./post-service

            - name: Save Docker images
              run: |
                  docker save user-service:latest -o user-service.tar
                  docker save post-service:latest -o post-service.tar

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: docker-images
                  path: |
                      user-service.tar
                      post-service.tar
                  retention-days: 1

    test:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: docker-images

            - name: Load Docker images
              run: |
                  docker load -i user-service.tar
                  docker load -i post-service.tar

            - name: Start services with docker compose
              run: |
                  docker compose up -d

            - name: Wait for services to be ready
              run: |
                  echo "Waiting for services to start..."
                  sleep 15

            - name: Check running containers
              run: |
                  docker compose ps

            - name: Check service logs
              if: always()
              run: |
                  echo "=== User Service Logs ==="
                  docker compose logs user-service
                  echo "=== Post Service Logs ==="
                  docker compose logs post-service
                  echo "=== Kong Logs ==="
                  docker compose logs kong

            - name: Test user-service endpoint
              run: |
                  curl -f http://localhost:3001/health || echo "User service health check failed"

            - name: Test post-service endpoint
              run: |
                  curl -f http://localhost:3002/health || echo "Post service health check failed"

            - name: Stop services
              if: always()
              run: |
                  docker compose down -v

            - name: Clean up Docker images
              if: always()
              run: |
                  docker image prune -f
